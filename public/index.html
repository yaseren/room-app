<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="initial-scale=1, width=device-width" />

  <title>Cloud Meet</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <!-- <link rel="stylesheet" href="/css/style.css"> -->
  <style>
    @font-face {
      font-family: "BYekan";
      src: url("../fonts/BYekan-webfont.eot") format("eot"), url("../fonts/BYekan-webfont.woff") format("woff"), url("../fonts/BYekan-webfont.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "iransans";
      src: url("../fonts/IRANSansWeb_Light.woff2") format("woff2");
      src: url("../fonts/IRANSansWeb_Light.woff") format("woff");
    }

    *{
      font-family: "BYekan" !important;
    }

    html {
      height: 100%
    }

    body {
      font-family: "BYekan" !important;
      background-color: #02212a;
      color: #000;
      font-family: nunito, sans-serif;
      font-size: .9375rem;
      height: 100%;
      line-height: 1.5;
      overflow-x: hidden;
    }

    #root {
      height: 100%;
      font-family: "BYekan" !important;
    }

  


    /* width */
    ::-webkit-scrollbar {
      width: 10px;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      box-shadow: inset 0 0 2px grey;
      border-radius: 5px;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: #303575;
      border-radius: 5px;
    }

    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
      background: #303575;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</body>

</html>
